AWSTemplateFormatVersion: '2010-09-09'
Description: Scholens registrations and least-privilege host admission grants.
Parameters:
  ExpectedAccountId: {Type: String, AllowedPattern: '[0-9]{12}'}
  ClusterArn: {Type: String}
  HostRoleName: {Type: String}
  Enabled: {Type: String, Default: 'false', AllowedValues: ['false', 'true']}
  DocumentTaskArn: {Type: String}
  DocumentTaskRoleArn: {Type: String}
  DocumentExecutionRoleArn: {Type: String}
  DocumentQueueUrl: {Type: String}
  DocumentQueueArn: {Type: String}
  DocumentIndexTaskArn: {Type: String}
  DocumentIndexTaskRoleArn: {Type: String}
  DocumentIndexExecutionRoleArn: {Type: String}
  DocumentIndexQueueUrl: {Type: String}
  DocumentIndexQueueArn: {Type: String}
  DocumentEnrichmentTaskArn: {Type: String}
  DocumentEnrichmentTaskRoleArn: {Type: String}
  DocumentEnrichmentExecutionRoleArn: {Type: String}
  DocumentEnrichmentQueueUrl: {Type: String}
  DocumentEnrichmentQueueArn: {Type: String}
  ResearchTaskArn: {Type: String}
  ResearchTaskRoleArn: {Type: String}
  ResearchExecutionRoleArn: {Type: String}
  ResearchQueueUrl: {Type: String}
  ResearchQueueArn: {Type: String}
  MaintenanceTaskArn: {Type: String}
  MaintenanceTaskRoleArn: {Type: String}
  MaintenanceExecutionRoleArn: {Type: String}
  MaintenanceQueueUrl: {Type: String}
  MaintenanceQueueArn: {Type: String}
  DocumentMemoryMiB: {Type: Number, Default: 1344, MinValue: 256, MaxValue: 2624}
  ResearchMemoryMiB: {Type: Number, Default: 832, MinValue: 256, MaxValue: 2624}
  MaintenanceMemoryMiB: {Type: Number, Default: 576, MinValue: 256, MaxValue: 2624}
  DocumentIndexMemoryMiB: {Type: Number, Default: 1088, MinValue: 256, MaxValue: 2624}
  DocumentEnrichmentMemoryMiB: {Type: Number, Default: 1088, MinValue: 256, MaxValue: 2624}
Rules:
  ExpectedAccount:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::AccountId', !Ref ExpectedAccountId]
        AssertDescription: Only the reviewed personal account is allowed.
Resources:
  AdmissionGrant:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ScholensBackgroundAdmission
      Roles: [!Ref HostRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecs:RunTask
            Resource: [!Ref DocumentIndexTaskArn, !Ref DocumentEnrichmentTaskArn, !Ref DocumentTaskArn, !Ref ResearchTaskArn, !Ref MaintenanceTaskArn]
            Condition: {ArnEquals: {'ecs:cluster': !Ref ClusterArn}}
          - Effect: Allow
            Action: iam:PassRole
            Resource: [!Ref DocumentIndexTaskRoleArn, !Ref DocumentIndexExecutionRoleArn, !Ref DocumentEnrichmentTaskRoleArn, !Ref DocumentEnrichmentExecutionRoleArn, !Ref DocumentTaskRoleArn, !Ref DocumentExecutionRoleArn, !Ref ResearchTaskRoleArn, !Ref ResearchExecutionRoleArn, !Ref MaintenanceTaskRoleArn, !Ref MaintenanceExecutionRoleArn]
            Condition: {StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}}
          - Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource: [!Ref DocumentIndexQueueArn, !Ref DocumentEnrichmentQueueArn, !Ref DocumentQueueArn, !Ref ResearchQueueArn, !Ref MaintenanceQueueArn]
  DocumentRegistration:
    Type: AWS::SSM::Parameter
    DependsOn: AdmissionGrant
    Properties:
      Name: /sanchezcloud/personal/background/scholens-document
      Type: String
      Value: !Sub '{"version":1,"name":"scholens-document","enabled":${Enabled},"task_definition":"${DocumentTaskArn}","memory_mib":${DocumentMemoryMiB},"priority":0,"lane":"interactive","queue_url":"${DocumentQueueUrl}"}'
  ResearchRegistration:
    Type: AWS::SSM::Parameter
    DependsOn: AdmissionGrant
    Properties:
      Name: /sanchezcloud/personal/background/scholens-research
      Type: String
      Value: !Sub '{"version":1,"name":"scholens-research","enabled":${Enabled},"task_definition":"${ResearchTaskArn}","memory_mib":${ResearchMemoryMiB},"priority":0,"lane":"interactive","queue_url":"${ResearchQueueUrl}"}'
  MaintenanceRegistration:
    Type: AWS::SSM::Parameter
    DependsOn: AdmissionGrant
    Properties:
      Name: /sanchezcloud/personal/background/scholens-maintenance
      Type: String
      Value: !Sub '{"version":1,"name":"scholens-maintenance","enabled":${Enabled},"task_definition":"${MaintenanceTaskArn}","memory_mib":${MaintenanceMemoryMiB},"priority":0,"lane":"interactive","queue_url":"${MaintenanceQueueUrl}"}'
  DocumentIndexRegistration:
    Type: AWS::SSM::Parameter
    DependsOn: AdmissionGrant
    Properties:
      Name: /sanchezcloud/personal/background/scholens-document-index
      Type: String
      Value: !Sub '{"version":1,"name":"scholens-document-index","enabled":${Enabled},"task_definition":"${DocumentIndexTaskArn}","memory_mib":${DocumentIndexMemoryMiB},"priority":0,"lane":"batch","queue_url":"${DocumentIndexQueueUrl}"}'
  DocumentEnrichmentRegistration:
    Type: AWS::SSM::Parameter
    DependsOn: AdmissionGrant
    Properties:
      Name: /sanchezcloud/personal/background/scholens-document-enrichment
      Type: String
      Value: !Sub '{"version":1,"name":"scholens-document-enrichment","enabled":${Enabled},"task_definition":"${DocumentEnrichmentTaskArn}","memory_mib":${DocumentEnrichmentMemoryMiB},"priority":0,"lane":"batch","queue_url":"${DocumentEnrichmentQueueUrl}"}'
