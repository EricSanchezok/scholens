AWSTemplateFormatVersion: '2010-09-09'
Description: Scholens canonical Web, API, workers, and schedules on ECS Fargate
Parameters:
  DomainName:
    Type: String
    Default: scholens.sanchezcloud.net
    AllowedPattern: ^[A-Za-z0-9.-]+$
  CertificateArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:acm:[^:]+:[0-9]{12}:certificate/[0-9a-f-]+$
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AvatarKmsKeyArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]+$
  WebImage:
    Type: String
    AllowedPattern:
      ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/sanchezcloud-scholens-web@sha256:[0-9a-f]{64}$
  ApiImage:
    Type: String
    AllowedPattern:
      ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/sanchezcloud-scholens-api@sha256:[0-9a-f]{64}$
  JobsImage:
    Type: String
    AllowedPattern:
      ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/sanchezcloud-scholens-jobs@sha256:[0-9a-f]{64}$
  ReleaseSha:
    Type: String
    AllowedPattern: ^[0-9a-f]{40}$
  EdgeSecretVersionId:
    Type: String
    AllowedPattern: ^[A-Za-z0-9-]{32,64}$
  EdgeSecretPreviousVersionId:
    Type: String
    AllowedPattern: ^[A-Za-z0-9-]{32,64}$
  ApplicationEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'false'
    - 'true'
  SchedulerState:
    Type: String
    Default: DISABLED
    AllowedValues:
    - DISABLED
    - ENABLED
  WebRequestsPerTarget:
    Type: Number
    Default: 600
    MinValue: 1
  ApiRequestsPerTarget:
    Type: Number
    Default: 300
    MinValue: 1
  ApiMaxCapacity:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 3
  RdsConnectionAlarmThreshold:
    Type: Number
    Default: 75
    MinValue: 1
  AdotImage:
    Type: String
    Default:
      public.ecr.aws/aws-observability/aws-otel-collector@sha256:89f97137f225aa96e055fee127de0ce0650e71ecc860bf862bf6aa55c49ba698
    AllowedPattern:
      ^public\.ecr\.aws/aws-observability/aws-otel-collector@sha256:[0-9a-f]{64}$
Rules:
  SchedulesRequireApplication:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::Equals:
          - Ref: SchedulerState
          - DISABLED
        - Fn::Equals:
          - Ref: ApplicationEnabled
          - 'true'
      AssertDescription: Schedules require the Scholens application to be
        enabled
Conditions:
  RunApplication:
    Fn::Equals:
    - Ref: ApplicationEnabled
    - 'true'
Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Scholens public ALB
      VpcId:
        Fn::ImportValue: sanchezcloud-production-vpc-id
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
      - IpProtocol: -1
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  WebIngressFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: sanchezcloud-scholens-application-sg-id
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId:
        Ref: LoadBalancerSecurityGroup
      Description: Canonical Web traffic from the ALB
  ApiIngressFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: sanchezcloud-scholens-application-sg-id
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId:
        Ref: LoadBalancerSecurityGroup
      Description: Public API traffic from the ALB
  ApiIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: sanchezcloud-scholens-application-sg-id
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId:
        Fn::ImportValue: sanchezcloud-scholens-application-sg-id
      Description: Private callbacks from Scholens workers and schedules
  DatabaseIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Ref: RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId:
        Fn::ImportValue: sanchezcloud-scholens-application-sg-id
      Description: Scholens application and migration traffic
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: sanchezcloud-scholens
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
      - Ref: LoadBalancerSecurityGroup
      Subnets:
      - Fn::ImportValue: sanchezcloud-production-public-subnet-1
      - Fn::ImportValue: sanchezcloud-production-public-subnet-2
      LoadBalancerAttributes:
      - Key: idle_timeout.timeout_seconds
        Value: '300'
      - Key: routing.http.drop_invalid_header_fields.enabled
        Value: 'true'
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: scholens-web
      VpcId:
        Fn::ImportValue: sanchezcloud-production-vpc-id
      Port: 3000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '60'
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: scholens-api
      VpcId:
        Fn::ImportValue: sanchezcloud-production-vpc-id
      Port: 8000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /readyz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: '60'
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
      - Type: redirect
        RedirectConfig:
          Protocol: HTTPS
          Port: '443'
          StatusCode: HTTP_301
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
      - CertificateArn:
          Ref: CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
      - Type: forward
        TargetGroupArn:
          Ref: WebTargetGroup
  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HttpsListener
      Priority: 10
      Conditions:
      - Field: path-pattern
        PathPatternConfig:
          Values:
          - /api/v1
          - /api/v1/*
          - /webhooks/v1
          - /webhooks/v1/*
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: ApiTargetGroup
  OperatorListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: HttpsListener
      Priority: 11
      Conditions:
      - Field: path-pattern
        PathPatternConfig:
          Values:
          - /mcp
          - /mcp/*
          - /admin
          - /admin/*
      Actions:
      - Type: forward
        TargetGroupArn:
          Ref: ApiTargetGroup
  LargeBodyPathSet:
    Type: AWS::WAFv2::RegexPatternSet
    Properties:
      Name: sanchezcloud-scholens-large-body-paths
      Scope: REGIONAL
      RegularExpressionList:
      - ^/mcp$
      - ^/api/v1/conversations(?:/.*)?$
      - ^/api/v2/conversations(?:/.*)?$
      - ^/api/v1/paper-ingestions(?:/.*)?$
      Tags:
      - {Key: System, Value: SanchezCloud}
      - {Key: Product, Value: Scholens}
      - {Key: Environment, Value: production}
      - {Key: ManagedBy, Value: CloudFormation}
  ContentFreeTextPathSet:
    Type: AWS::WAFv2::RegexPatternSet
    Properties:
      Name: sanchezcloud-scholens-free-text-content-paths
      Scope: REGIONAL
      RegularExpressionList:
      - ^/api/v1/papers/[^/]+/selection-translations$
      - ^/api/v1/papers/[^/]+/annotation-threads(?:/.*)?$
      - ^/api/v1/annotation-threads(?:/.*)?$
      - ^/api/v1/annotation-comments(?:/.*)?$
      - ^/api/v1/library/papers/[^/]+$
      - ^/api/v1/me/translation-preferences$
      - ^/api/v1/projects(?:/[^/]+(?:/data-tables)?)?$
      - ^/api/v1/me/onboarding$
      - ^/api/v1/(?:papers|projects)/[^/]+/audio-overviews$
      - ^/api/v1/search/(?:conversations|papers|research)$
      Tags:
      - {Key: System, Value: SanchezCloud}
      - {Key: Product, Value: Scholens}
      - {Key: Environment, Value: production}
      - {Key: ManagedBy, Value: CloudFormation}
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: sanchezcloud-scholens
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: sanchezcloud-scholens
        SampledRequestsEnabled: false
      DataProtectionConfig:
        DataProtections:
        - Field: {FieldType: BODY}
          Action: SUBSTITUTION
          ExcludeRuleMatchDetails: false
          ExcludeRateBasedDetails: false
      Rules:
      - Name: RequireCloudflareOriginToken
        Priority: 0
        Action:
          Block: {}
        Statement:
          NotStatement:
            Statement:
              OrStatement:
                Statements:
                - ByteMatchStatement:
                    FieldToMatch:
                      SingleHeader:
                        Name: x-scholens-origin
                    PositionalConstraint: EXACTLY
                    SearchString:
                      Fn::Sub:
                      - '{{resolve:secretsmanager:${Secret}:SecretString:origin_token::${Version}}}'
                      - Secret:
                          Fn::ImportValue: sanchezcloud-scholens-edge-secret-arn
                        Version:
                          Ref: EdgeSecretVersionId
                    TextTransformations:
                    - Priority: 0
                      Type: NONE
                - ByteMatchStatement:
                    FieldToMatch:
                      SingleHeader:
                        Name: x-scholens-origin
                    PositionalConstraint: EXACTLY
                    SearchString:
                      Fn::Sub:
                      - '{{resolve:secretsmanager:${Secret}:SecretString:origin_token::${Version}}}'
                      - Secret:
                          Fn::ImportValue: sanchezcloud-scholens-edge-secret-arn
                        Version:
                          Ref: EdgeSecretPreviousVersionId
                    TextTransformations:
                    - Priority: 0
                      Type: NONE
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: scholens-origin-token
          SampledRequestsEnabled: false
      - Name: CommonThreatsStandardBodies
        Priority: 10
        OverrideAction:
          None: {}
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesCommonRuleSet
            ScopeDownStatement:
              NotStatement:
                Statement:
                  OrStatement:
                    Statements:
                    - RegexPatternSetReferenceStatement:
                        Arn:
                          Fn::GetAtt: [LargeBodyPathSet, Arn]
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                        - {Priority: 0, Type: NONE}
                    - RegexPatternSetReferenceStatement:
                        Arn:
                          Fn::GetAtt: [ContentFreeTextPathSet, Arn]
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                        - {Priority: 0, Type: NONE}
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: scholens-common-threats-standard-body
          SampledRequestsEnabled: false
      - Name: CommonThreatsReviewedLargeBodies
        Priority: 11
        OverrideAction:
          None: {}
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesCommonRuleSet
            RuleActionOverrides:
            - {Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}
            - {Name: EC2MetaDataSSRF_BODY, ActionToUse: {Count: {}}}
            - {Name: GenericLFI_BODY, ActionToUse: {Count: {}}}
            - {Name: GenericRFI_BODY, ActionToUse: {Count: {}}}
            - {Name: CrossSiteScripting_BODY, ActionToUse: {Count: {}}}
            ScopeDownStatement:
              OrStatement:
                Statements:
                - RegexPatternSetReferenceStatement:
                    Arn:
                      Fn::GetAtt: [LargeBodyPathSet, Arn]
                    FieldToMatch:
                      UriPath: {}
                    TextTransformations:
                    - {Priority: 0, Type: NONE}
                - RegexPatternSetReferenceStatement:
                    Arn:
                      Fn::GetAtt: [ContentFreeTextPathSet, Arn]
                    FieldToMatch:
                      UriPath: {}
                    TextTransformations:
                    - {Priority: 0, Type: NONE}
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: scholens-common-threats-reviewed-large-body
          SampledRequestsEnabled: false
      - Name: IpReputation
        Priority: 20
        OverrideAction:
          None: {}
        Statement:
          ManagedRuleGroupStatement:
            VendorName: AWS
            Name: AWSManagedRulesAmazonIpReputationList
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: scholens-ip-reputation
          SampledRequestsEnabled: false
      - Name: CloudflareClientRateLimit
        Priority: 30
        Action:
          Block: {}
        Statement:
          RateBasedStatement:
            Limit: 2000
            AggregateKeyType: FORWARDED_IP
            ForwardedIPConfig:
              HeaderName: CF-Connecting-IP
              FallbackBehavior: MATCH
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          MetricName: scholens-client-rate
          SampledRequestsEnabled: false
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn:
        Ref: LoadBalancer
      WebACLArn:
        Fn::GetAtt:
        - WebAcl
        - Arn
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: aws-waf-logs-scholens-production
      RetentionInDays: 30
  WebAclLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn:
        Fn::GetAtt: [WebAcl, Arn]
      LogDestinationConfigs:
      - Fn::GetAtt: [WafLogGroup, Arn]
      RedactedFields:
      - SingleHeader: {Name: x-scholens-origin}
      - SingleHeader: {Name: cookie}
      - SingleHeader: {Name: authorization}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
        - Behavior: KEEP
          Requirement: MEETS_ANY
          Conditions:
          - ActionCondition: {Action: BLOCK}
          - ActionCondition: {Action: COUNT}
          - ActionCondition: {Action: EXCLUDED_AS_COUNT}
  ApiDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: scholens-api
      NamespaceId:
        Fn::ImportValue: sanchezcloud-production-namespace-id
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
        - Type: A
          TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  TelemetryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SanchezCloudScholensTelemetry
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
          Resource: '*'
        - Effect: Allow
          Action: cloudwatch:PutMetricData
          Resource: '*'
          Condition:
            StringEquals:
              cloudwatch:namespace: Scholens/Production
        - Effect: Allow
          Action:
          - logs:CreateLogStream
          - logs:DescribeLogStreams
          - logs:PutLogEvents
          Resource:
            Fn::Sub:
              arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/sanchezcloud/scholens/*
      Roles:
      - Ref: ApiTaskRole
      - Ref: DocumentWorkerTaskRole
      - Ref: ResearchWorkerTaskRole
      - Ref: MaintenanceWorkerTaskRole
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholensApiTaskRole
      PermissionsBoundary:
        Fn::ImportValue: sanchezcloud-scholens-runtime-task-boundary-arn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ScholensApiDataPlane
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:AbortMultipartUpload
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            - s3:PutObject
            Resource:
            - Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
            - Fn::Sub:
              - ${BucketArn}/*
              - BucketArn:
                  Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
          - Effect: Allow
            Action: s3:GetObjectVersion
            Resource:
              Fn::Sub:
              - ${BucketArn}/uploads/*
              - BucketArn:
                  Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
          - Effect: Allow
            Action:
            - kms:Decrypt
            - kms:Encrypt
            - kms:GenerateDataKey
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-content-key-arn
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::sanchezcloud-account-avatars-${AWS::AccountId}-${AWS::Region}/auth/avatars/v1/*
          - Effect: Allow
            Action: kms:Decrypt
            Resource:
              Ref: AvatarKmsKeyArn
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: s3.${AWS::Region}.${AWS::URLSuffix}
              StringLike:
                kms:EncryptionContext:aws:s3:arn:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sanchezcloud-account-avatars-${AWS::AccountId}-${AWS::Region}/auth/avatars/v1/*
          - Effect: Allow
            Action:
            - sqs:GetQueueAttributes
            - sqs:SendMessage
            Resource:
            - Fn::ImportValue: sanchezcloud-scholens-conversation-queue-arn
            - Fn::ImportValue: sanchezcloud-scholens-document-queue-arn
            - Fn::ImportValue: sanchezcloud-scholens-research-queue-arn
            - Fn::ImportValue: sanchezcloud-scholens-maintenance-queue-arn
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub:
              - ${BucketArn}/api/*
              - BucketArn:
                  Fn::ImportValue: sanchezcloud-scholens-diagnostic-bucket-arn
          - Effect: Allow
            Action:
            - kms:Encrypt
            - kms:GenerateDataKey
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-diagnostic-key-arn
          - Effect: Allow
            Action:
            - sqs:ChangeMessageVisibility
            - sqs:DeleteMessage
            - sqs:GetQueueUrl
            - sqs:ReceiveMessage
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-conversation-queue-arn
          - Effect: Allow
            Action: ecs:UpdateTaskProtection
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::ImportValue: sanchezcloud-production-cluster-arn
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  DocumentWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholensDocumentWorkerTaskRole
      PermissionsBoundary:
        Fn::ImportValue: sanchezcloud-scholens-runtime-task-boundary-arn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: DocumentWorkerDataPlane
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:ChangeMessageVisibility
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
            - sqs:ReceiveMessage
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-document-queue-arn
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            - s3:PutObject
            Resource:
            - Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
            - Fn::Sub:
              - ${BucketArn}/*
              - BucketArn:
                  Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
          - Effect: Allow
            Action:
            - kms:Decrypt
            - kms:Encrypt
            - kms:GenerateDataKey
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-content-key-arn
          - Effect: Allow
            Action: ecs:UpdateTaskProtection
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::ImportValue: sanchezcloud-production-cluster-arn
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub:
              - ${BucketArn}/workers/*
              - BucketArn:
                  Fn::ImportValue: sanchezcloud-scholens-diagnostic-bucket-arn
          - Effect: Allow
            Action:
            - kms:Encrypt
            - kms:GenerateDataKey
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-diagnostic-key-arn
      Tags:
      - Key: System
        Value: SanchezCloud
      - Key: Product
        Value: Scholens
      - Key: Environment
        Value: production
      - Key: ManagedBy
        Value: CloudFormation
  ResearchWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SanchezCloudScholensResearchWorkerTaskRole
      PermissionsBoundary:
        Fn::ImportValue: sanchezcloud-scholens-runtime-task-boundary-arn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ResearchWorkerDataPlane
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:ChangeMessageVisibility
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
            - sqs:ReceiveMessage
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-research-queue-arn
          - Effect: Allow
            Action:
            - s3:DeleteObject
            - s3:GetObject
            - s3:ListBucket
            - s3:PutObject
            Resource:
            - Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
            - Fn::Sub:
              - ${BucketArn}/*
              - BucketArn:
                  Fn::ImportValue: sanchezcloud-scholens-content-bucket-arn
          - Effect: Allow
            Action:
            - kms:Decrypt
            - kms:Encrypt
            - kms:GenerateDataKey
            Resource:
              Fn::ImportValue: sanchezcloud-scholens-content-key-arn
          - Effect: Allow
            Action: ecs:UpdateTaskProtection
            Resource: '*'
            Condition:
              ArnEquals:
                ecs:cluster:
                  Fn::ImportValue: sanchezcloud-production-cluster-arn
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              Fn::Sub:
              - ${BucketArn}/workers/*
              - BucketArn:
