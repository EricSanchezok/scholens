                MetricName: ApproximateNumberOfMessagesVisible
                Dimensions:
                - Name: QueueName
                  Value: scholens-production-conversation
            ReturnData: false
          - Id: running
            MetricStat:
              Stat: Average
              Metric:
                Namespace: ECS/ContainerInsights
                MetricName: RunningTaskCount
                Dimensions:
                - Name: ClusterName
                  Value:
                    Fn::ImportValue: sanchezcloud-production-cluster-name
                - Name: ServiceName
                  Value:
                    Fn::GetAtt:
                    - ConversationWorkerService
                    - Name
            ReturnData: false
          - Id: backlogpertask
