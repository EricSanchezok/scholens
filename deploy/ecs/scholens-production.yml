  ZoteroSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: sanchezcloud-scholens-zotero-sync
      Description: Run hourly Server maintenance and persist Zotero jobs when due
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: rate(1 hour)
      State:
        Ref: SchedulerState
      Target:
        Arn:
          Fn::ImportValue: sanchezcloud-production-cluster-arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerInvocationRole
          - Arn
        DeadLetterConfig:
          Arn:
            Fn::ImportValue: sanchezcloud-scholens-scheduler-dlq-arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        EcsParameters:
          TaskDefinitionArn:
            Ref: SchedulerTaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          EnableECSManagedTags: true
          EnableExecuteCommand: false
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: DISABLED
              SecurityGroups:
              - Fn::ImportValue: sanchezcloud-scholens-application-sg-id
              Subnets:
              - Fn::ImportValue: sanchezcloud-production-private-subnet-1
              - Fn::ImportValue: sanchezcloud-production-private-subnet-2
