name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git revision to verify
        required: false
        type: string
    secrets:
      IDENTITY_READER_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: scholens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked dependencies
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.identity-token.outputs.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --frozen --group dev
      - name: Run Server gate
        working-directory: ${{ github.workspace }}
        run: ./scripts/run-gates.sh server

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium
      - name: Run legacy Client gate
        working-directory: ${{ github.workspace }}
        run: ./scripts/run-gates.sh client

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run canonical Web gate
        working-directory: ${{ github.workspace }}
        run: ./scripts/run-gates.sh web

  jobs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Run Jobs gate
        working-directory: ${{ github.workspace }}
        run: ./scripts/run-gates.sh jobs

  shared-packages:
    name: Shared Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install locked shared-package dependencies
        run: uv sync --directory packages --frozen --all-packages
      - name: Run shared-package gate
        run: ./scripts/run-gates.sh shared-packages

  deployment-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-password
          POSTGRES_DB: sanchezcloud
        ports:
          - 5432:5432
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanchezcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    steps:
      - name: Check out Scholens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve checked-out image revision
        id: image-revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "identity_revision=$(python scripts/release_manifest.py identity-revision)" >> "$GITHUB_OUTPUT"
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Configure read-only private dependency access
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: >-
          git config --global
          url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Install pinned auth migration tool
        run: uv sync --project server --frozen --group dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install deployment validators
        run: |
          uv tool install cfn-lint
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Run deployment static gate
        run: ./scripts/run-gates.sh deployment
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: scholens-api:ci
          build-args: |
            SANCHEZCLOUD_IDENTITY_REVISION=${{ steps.image-revision.outputs.identity_revision }}
          secrets: |
            github_token=${{ steps.identity-token.outputs.token }}
      - name: Build jobs image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: jobs/Dockerfile
          push: false
          load: true
          tags: scholens-jobs:ci
      - name: Verify hardened Python runtimes
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python scholens-api:ci -c \
            "import os, pycurl; assert os.getuid() != 0; assert not os.path.exists('/usr/bin/perl')"
          docker run --rm --env S3_BUCKET_NAME=scholens-ci \
            --env SCHOLENS_AI_DEEPSEEK_API_KEY=ci-not-a-real-key \
            scholens-jobs:ci python -c \
            "import os, ssl, grpc, onnxruntime, pycurl, pymupdf, pymupdf4llm, src.tasks; assert os.getuid() != 0; assert not os.path.exists('/bin/sh'); assert not os.path.exists('/usr/bin/perl'); assert not os.path.exists('/usr/local/bin/pip'); assert ssl.create_default_context().get_ca_certs()"
          docker run --rm scholens-jobs:ci celery --version
      - name: Build canonical Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          file: web/Dockerfile
          target: runtime
          push: false
          build-args: |
            RELEASE_SHA=${{ steps.image-revision.outputs.sha }}
            NEXT_PUBLIC_API_URL=https://scholens.example.invalid
            NEXT_PUBLIC_ACCOUNT_CENTER_URL=https://account.example.invalid
      - name: Verify independent migrations with least-privilege roles
        env:
          PGPASSWORD: migration-test-password
          AUTH_MIGRATOR_PASSWORD: auth-migrator-test-password
          MIGRATOR_PASSWORD: migrator-test-password
          APP_PASSWORD: app-test-password
        run: |
          psql -h 127.0.0.1 -U postgres -d sanchezcloud -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE auth_migrator LOGIN PASSWORD '$AUTH_MIGRATOR_PASSWORD';
             CREATE ROLE scholens_migrator LOGIN PASSWORD '$MIGRATOR_PASSWORD';
             CREATE ROLE scholens_app LOGIN PASSWORD '$APP_PASSWORD';"

          for phase in before after-auth after-scholens; do
            psql -h 127.0.0.1 -U postgres -d sanchezcloud \
              -v app_role=scholens_app \
              -v auth_migrator_role=auth_migrator \
              -v product_migrator_role=scholens_migrator \
              -f deploy/ecs/database-bootstrap.sql

            if [[ $phase == before ]]; then
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                server/.venv/bin/sanchezcloud-identity migrate
              AUTH_DATABASE_URL="postgresql://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                server/.venv/bin/sanchezcloud-identity check-schema
            elif [[ $phase == after-auth ]]; then
              for _ in 1 2; do
                docker run --rm --network host --entrypoint scholens \
                  -e DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                  scholens-api:ci db upgrade --yes --json
              done
              docker run --rm --network host --entrypoint alembic \
                -e DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
                scholens-api:ci check
            fi
          done

          psql -h 127.0.0.1 -U postgres -d sanchezcloud -tAc \
            "SELECT to_regclass('auth.schema_migrations') IS NOT NULL
                 AND to_regclass('scholens.schema_migrations') IS NOT NULL
                 AND to_regclass('auth.users') IS NOT NULL
                 AND to_regclass('auth.refresh_tokens') IS NOT NULL
                 AND NOT has_table_privilege(
                   'scholens_app', 'auth.users', 'DELETE'
                 )
                 AND NOT has_table_privilege(
                   'scholens_app', 'auth.refresh_tokens', 'DELETE'
                 )
                 AND to_regclass('scholens.documents') IS NOT NULL
                 AND to_regclass('scholens.library_papers') IS NOT NULL
                 AND to_regclass('scholens.user_profiles') IS NOT NULL
                 AND to_regclass('scholens.operation_journal_entries') IS NOT NULL
                 AND to_regclass('scholens.account_plan_grants') IS NOT NULL
                 AND to_regclass('scholens.account_quota_overrides') IS NOT NULL
                 AND NOT has_table_privilege(
                   'scholens_app',
                   'scholens.operation_journal_entries',
                   'UPDATE'
                 )
                 AND NOT has_table_privilege(
                   'scholens_app',
                   'scholens.operation_journal_entries',
                   'DELETE'
                 )
                 AND to_regclass('scholens.discover_searches') IS NULL
                 AND EXISTS (
                   SELECT 1
                   FROM pg_trigger
                   WHERE tgname = 'tsvectorupdate' AND NOT tgisinternal
                 )
                 AND EXISTS (
                   SELECT 1
                   FROM pg_trigger
                   WHERE tgname = 'document_passages_tsvectorupdate' AND NOT tgisinternal
                 )
                 AND NOT EXISTS (
                   SELECT 1 FROM pg_tables WHERE schemaname = 'public'
                 )
                 AND NOT has_database_privilege('auth_migrator', current_database(), 'CREATE')
                 AND NOT has_database_privilege('scholens_migrator', current_database(), 'CREATE')
                 AND NOT has_database_privilege('scholens_app', current_database(), 'CREATE')" \
            | grep -qx t

          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c \
            "BEGIN;
             INSERT INTO auth.users (email, password_hash)
               VALUES
                 ('ci-owner@example.invalid', 'fixture'),
                 ('ci-collaborator@example.invalid', 'fixture');
             INSERT INTO scholens.user_profiles (user_id)
               SELECT id FROM auth.users
               WHERE email = 'ci-owner@example.invalid';
             INSERT INTO scholens.documents
               (id, sha256, original_filename, mime_type, size_bytes,
                s3_object_key, title, raw_content, processing_status,
                created_by_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000001',
                 repeat('a', 64),
                 'fixture.pdf',
                 'application/pdf',
                 1024,
                 'documents/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/source.pdf',
                 'Semantic search',
                 'retrieval augmented generation',
                 'completed',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid')
               );
             INSERT INTO scholens.library_papers
               (id, user_id, document_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000007',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 '00000000-0000-0000-0000-000000000001'
               );
             INSERT INTO scholens.document_passages
               (document_id, start_line, end_line, content)
               VALUES (
                 '00000000-0000-0000-0000-000000000001',
                 1,
                 1,
                 'retrieval augmented generation'
               );
             INSERT INTO scholens.projects
               (id, title, description, owner_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000002',
                 'CI project',
                 'relationship test',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid')
               );
             INSERT INTO scholens.project_collaborators
               (id, project_id, user_id, can_edit_project,
                can_manage_papers, can_manage_collaborators)
               VALUES (
                 '00000000-0000-0000-0000-000000000003',
                 '00000000-0000-0000-0000-000000000002',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-collaborator@example.invalid'),
                 true,
                 true,
                 false
               );
             INSERT INTO scholens.project_papers
               (id, document_id, project_id, added_by_id)
               VALUES (
                 '00000000-0000-0000-0000-000000000004',
                 '00000000-0000-0000-0000-000000000001',
                 '00000000-0000-0000-0000-000000000002',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-collaborator@example.invalid')
               );
             INSERT INTO scholens.token_weekly_usage
               (user_id, week_start, used_tokens)
               VALUES (
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 date_trunc('week', now())::date,
                 17
               );
             INSERT INTO scholens.token_usage_events
               (id, user_id, week_start, idempotency_key, operation_id,
                feature, provider, model, ai_profile, thinking, thinking_effort,
                profile_revision, prompt_tokens,
                completion_tokens, reasoning_tokens, cache_hit_tokens,
                cache_miss_tokens, total_tokens, status)
               VALUES (
                 '00000000-0000-0000-0000-000000000005',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 date_trunc('week', now())::date,
                 'ci-token-event',
                 'ci-operation',
                 'chat',
                 'deepseek',
                 'fixture-model',
                 'standard',
                 'disabled',
                 'none',
                 'fixture-profile-revision',
                 11,
                 6,
                 0,
                 0,
                 0,
                 17,
                 'settled'
               );
             INSERT INTO scholens.subscriptions
               (id, user_id, plan, status, cancel_at_period_end)
               VALUES (
                 '00000000-0000-0000-0000-000000000006',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'),
                 'basic',
                 'active',
                 false
               );
             SELECT 1 / (
               (SELECT ts_vector IS NOT NULL FROM scholens.documents
                WHERE id = '00000000-0000-0000-0000-000000000001')::int
               *
               (SELECT ts_vector IS NOT NULL FROM scholens.document_passages
                WHERE document_id = '00000000-0000-0000-0000-000000000001')::int
               *
               (SELECT count(*) = 1 FROM scholens.library_papers
                WHERE document_id = '00000000-0000-0000-0000-000000000001')::int
               *
               (SELECT count(*) = 1 FROM scholens.project_papers
                WHERE project_id = '00000000-0000-0000-0000-000000000002')::int
               *
               (SELECT used_tokens = 17 FROM scholens.token_weekly_usage
                WHERE user_id = (
                  SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'
                ))::int
               *
               (SELECT count(*) = 1 FROM scholens.subscriptions
                WHERE user_id = (
                  SELECT id FROM auth.users
                  WHERE email = 'ci-owner@example.invalid'
                ))::int
             );
             DELETE FROM scholens.projects
               WHERE id = '00000000-0000-0000-0000-000000000002';
             SELECT 1 / (
               (NOT EXISTS (
                 SELECT 1 FROM scholens.project_collaborators
                 WHERE project_id = '00000000-0000-0000-0000-000000000002'
               ))::int
               *
               (NOT EXISTS (
                 SELECT 1 FROM scholens.project_papers
                 WHERE project_id = '00000000-0000-0000-0000-000000000002'
               ))::int
               *
               (EXISTS (
                 SELECT 1 FROM scholens.documents
                 WHERE id = '00000000-0000-0000-0000-000000000001'
               ))::int
               *
               (EXISTS (
                 SELECT 1 FROM scholens.library_papers
                 WHERE document_id = '00000000-0000-0000-0000-000000000001'
               ))::int
             );
             ROLLBACK;"

          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c \
            "INSERT INTO auth.users (email, password_hash)
               VALUES
                 ('ci-search-owner@example.com', 'fixture'),
                 ('ci-search-collaborator@example.com', 'fixture'),
                 ('ci-search-outsider@example.com', 'fixture');
             INSERT INTO scholens.documents
               (id, sha256, original_filename, mime_type, size_bytes,
                s3_object_key, title, raw_content, processing_status,
                created_by_id)
               VALUES
                 (
                   '10000000-0000-0000-0000-000000000001',
                   repeat('1', 64), 'title.pdf', 'application/pdf', 100,
                   'documents/title/source.pdf', 'Neural retrieval systems',
                   'metadata-only fixture', 'completed',
                   (SELECT id FROM auth.users
                    WHERE email = 'ci-search-owner@example.com')
                 ),
                 (
                   '10000000-0000-0000-0000-000000000002',
                   repeat('2', 64), 'body.pdf', 'application/pdf', 100,
                   'documents/body/source.pdf', 'Body match',
                   'neural retrieval appears in this body', 'completed',
                   (SELECT id FROM auth.users
                    WHERE email = 'ci-search-owner@example.com')
                 ),
                 (
                   '10000000-0000-0000-0000-000000000003',
                   repeat('3', 64), 'project.pdf', 'application/pdf', 100,
                   'documents/project/source.pdf', 'Project neural retrieval',
                   'project-only fixture', 'completed',
                   (SELECT id FROM auth.users
                    WHERE email = 'ci-search-owner@example.com')
                 ),
                 (
                   '10000000-0000-0000-0000-000000000004',
                   repeat('4', 64), 'hidden.pdf', 'application/pdf', 100,
                   'documents/hidden/source.pdf', 'Hidden neural retrieval',
                   'must remain inaccessible', 'completed',
                   (SELECT id FROM auth.users
                    WHERE email = 'ci-search-owner@example.com')
                 );
             INSERT INTO scholens.library_papers
               (id, user_id, document_id)
               VALUES
                 (
                   '10000000-0000-0000-0000-000000000021',
                   (SELECT id FROM auth.users
                    WHERE email = 'ci-search-owner@example.com'),
                   '10000000-0000-0000-0000-000000000001'
                 ),
                 (
                   '10000000-0000-0000-0000-000000000022',
                   (SELECT id FROM auth.users
                    WHERE email = 'ci-search-owner@example.com'),
                   '10000000-0000-0000-0000-000000000002'
                 );
             INSERT INTO scholens.document_passages
               (document_id, start_line, end_line, content)
               VALUES
                 (
                   '10000000-0000-0000-0000-000000000002',
                   40, 44, 'neural retrieval appears in this body'
                 ),
                 (
                   '10000000-0000-0000-0000-000000000003',
                   10, 14, 'project neural retrieval passage'
                 );
             INSERT INTO scholens.projects
               (id, title, description, owner_id)
               VALUES (
                 '10000000-0000-0000-0000-000000000010',
                 'Search integration project', 'fixture',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-search-owner@example.com')
               );
             INSERT INTO scholens.project_collaborators
               (id, project_id, user_id, can_edit_project,
                can_manage_papers, can_manage_collaborators)
               VALUES (
                 '10000000-0000-0000-0000-000000000011',
                 '10000000-0000-0000-0000-000000000010',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-search-collaborator@example.com'),
                 true, true, false
               );
             INSERT INTO scholens.project_papers
               (id, document_id, project_id, added_by_id)
               VALUES (
                 '10000000-0000-0000-0000-000000000012',
                 '10000000-0000-0000-0000-000000000003',
                 '10000000-0000-0000-0000-000000000010',
                 (SELECT id FROM auth.users
                  WHERE email = 'ci-search-owner@example.com')
               );"

          docker run --rm --network host --entrypoint scholens \
            -e DATABASE_URL="postgresql+psycopg2://scholens_app:${APP_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
            scholens-api:ci verify paper-search

          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c \
            "DELETE FROM scholens.projects
               WHERE id = '10000000-0000-0000-0000-000000000010';
             DELETE FROM scholens.library_papers
               WHERE id IN (
                 '10000000-0000-0000-0000-000000000021',
                 '10000000-0000-0000-0000-000000000022'
               );
             DELETE FROM scholens.documents
               WHERE id BETWEEN
                 '10000000-0000-0000-0000-000000000001'
                 AND '10000000-0000-0000-0000-000000000004';"
          PGPASSWORD="$PGPASSWORD" psql -h 127.0.0.1 -U postgres -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c \
            "DELETE FROM auth.users
               WHERE email LIKE 'ci-search-%@example.invalid';"

          if PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c "CREATE TABLE public.app_must_not_create (id integer)"; then
            printf 'scholens_app unexpectedly has DDL privileges\n' >&2
            exit 1
          fi

          if PGPASSWORD="$MIGRATOR_PASSWORD" psql -h 127.0.0.1 -U scholens_migrator \
            -d sanchezcloud -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE auth.product_migrator_must_not_create (id integer)"; then
            printf 'scholens_migrator unexpectedly has auth DDL privileges\n' >&2
            exit 1
          fi

          if PGPASSWORD="$AUTH_MIGRATOR_PASSWORD" psql -h 127.0.0.1 -U auth_migrator \
            -d sanchezcloud -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE scholens.auth_migrator_must_not_create (id integer)"; then
            printf 'auth_migrator unexpectedly has Scholens DDL privileges\n' >&2
            exit 1
          fi

          SCHOLENS_POSTGRES_TEST_URL="postgresql+psycopg2://scholens_app:${APP_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
          SCHOLENS_POSTGRES_TEST_ADMIN_URL="postgresql+psycopg2://postgres:${PGPASSWORD}@127.0.0.1:5432/sanchezcloud" \
            server/.venv/bin/pytest \
              server/tests/test_postgres_quota_invariants.py -q

          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app -d sanchezcloud \
            -v ON_ERROR_STOP=1 -c \
            "INSERT INTO auth.users
               (email, password_hash, status, email_verified_at)
             VALUES
               ('ci-cli-admin@example.com', 'fixture', 'active', now()),
               ('ci-cli-target@example.com', 'fixture', 'active', now());"

          export DATABASE_URL="postgresql+psycopg2://scholens_app:${APP_PASSWORD}@127.0.0.1:5432/sanchezcloud"
          server/.venv/bin/scholens users bootstrap-admin \
            --email ci-cli-admin@example.com --yes
          server/.venv/bin/scholens entitlements grant-researcher \
            --actor-email ci-cli-admin@example.com \
            --email ci-cli-target@example.com \
            --reason 'CI entitlement integration' --yes
          server/.venv/bin/scholens entitlements grant-researcher \
            --actor-email ci-cli-admin@example.com \
            --email ci-cli-target@example.com \
            --reason 'CI entitlement integration' --yes --json \
            | grep -q '"status": "unchanged"'
          server/.venv/bin/scholens entitlements quota-set \
            --actor-email ci-cli-admin@example.com \
            --email ci-cli-target@example.com \
            --resource paper_uploads --value 0 \
            --reason 'CI quota boundary' --yes
          server/.venv/bin/scholens entitlements quota-clear \
            --actor-email ci-cli-admin@example.com \
            --email ci-cli-target@example.com \
            --resource paper_uploads --reason 'CI quota boundary complete' --yes
          server/.venv/bin/scholens entitlements revoke-researcher \
            --actor-email ci-cli-admin@example.com \
            --email ci-cli-target@example.com \
            --reason 'CI entitlement complete' --yes
          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app \
            -d sanchezcloud -tAc \
            "SELECT EXISTS (
               SELECT 1 FROM scholens.account_plan_grants
               WHERE reason = 'CI entitlement integration'
                 AND revocation_reason = 'CI entitlement complete'
             )
             AND EXISTS (
               SELECT 1 FROM scholens.account_quota_overrides
               WHERE reason = 'CI quota boundary'
                 AND revocation_reason = 'CI quota boundary complete'
             )" \
            | grep -qx t

          (
            cd server
            DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
              .venv/bin/alembic downgrade b12d7d620e91
          )
          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app \
            -d sanchezcloud -tAc \
            "SELECT EXISTS (
               SELECT 1 FROM scholens.operation_journal_entries
               WHERE origin_kind = 'cli'
             )
             AND to_regclass('scholens.account_plan_grants') IS NULL
             AND to_regclass('scholens.account_quota_overrides') IS NULL" \
            | grep -qx t
          SCHOLENS_MIGRATION_DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:5432/sanchezcloud" \
            server/.venv/bin/scholens db upgrade --yes
          PGPASSWORD="$APP_PASSWORD" psql -h 127.0.0.1 -U scholens_app \
            -d sanchezcloud -tAc \
            "SELECT EXISTS (
               SELECT 1 FROM scholens.operation_journal_entries
               WHERE origin_kind = 'cli'
             )" \
            | grep -qx t

          export LOCAL_DATABASE_ADMIN_URL="postgresql://postgres:${PGPASSWORD}@127.0.0.1:55432/sanchezcloud"
          export SCHOLENS_MIGRATION_DATABASE_URL="postgresql+psycopg2://scholens_migrator:${MIGRATOR_PASSWORD}@127.0.0.1:55432/sanchezcloud"
          server/.venv/bin/scholens dev reset-product \
            --confirm RESET-SCHOLENS-LOCAL --json \
            | grep -q '"auth_unchanged": true'
          PGPASSWORD="$PGPASSWORD" psql -h 127.0.0.1 -p 55432 -U postgres \
            -d sanchezcloud -v ON_ERROR_STOP=1 -c \
            "DELETE FROM auth.users
             WHERE email IN (
               'ci-cli-admin@example.com',
               'ci-cli-target@example.com'
             );"

  all-checks-passed:
    name: all checks passed
    if: ${{ always() }}
    needs:
      - server
      - jobs
      - shared-packages
      - web
      - client
      - deployment-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to succeed
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          JOBS_RESULT: ${{ needs.jobs.result }}
          SHARED_PACKAGES_RESULT: ${{ needs.shared-packages.result }}
          WEB_RESULT: ${{ needs.web.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-contract.result }}
        run: |
          failed=0
          for lane in \
            "Server:$SERVER_RESULT" \
            "Jobs:$JOBS_RESULT" \
            "Shared Packages:$SHARED_PACKAGES_RESULT" \
            "Web:$WEB_RESULT" \
            "Legacy Client:$CLIENT_RESULT" \
            "Deployment Contract:$DEPLOYMENT_RESULT"; do
            name="${lane%%:*}"
            result="${lane#*:}"
            if [[ $result != success ]]; then
              printf '%s finished with result: %s\n' "$name" "$result" >&2
              failed=1
            fi
          done
          exit "$failed"
