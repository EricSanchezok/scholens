name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a release or roll back to a previous immutable release
        required: true
        type: choice
        options: [deploy, rollback]
      release_sha:
        description: Exact 40-character SHA whose release manifest will be deployed
        required: true
        type: string
      application_enabled:
        description: Start application services (false for first database migration)
        required: true
        default: "true"
        type: choice
        options: ["false", "true"]
      scheduler_state:
        description: Run the daily Zotero schedule
        required: true
        default: DISABLED
        type: choice
        options: [DISABLED, ENABLED]

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholens-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release selection
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SCHEDULER_STATE: ${{ inputs.scheduler_state }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$APPLICATION_ENABLED" != true && "$SCHEDULER_STATE" == ENABLED ]]; then
            echo "The scheduler cannot run while application services are disabled" >&2
            exit 1
          fi
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require revision to be merged into main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Download and verify release manifest
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          ACCOUNT_CENTER_URL: ${{ vars.ACCOUNT_CENTER_URL }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          aws s3 cp "s3://${bucket}/releases/${RELEASE_SHA}/manifest.json" release-manifest.json
          python scripts/release_manifest.py verify \
            --manifest release-manifest.json \
            --expected-release-sha "$RELEASE_SHA" \
            --expected-account-id "$account_id" \
            --expected-region "$AWS_REGION"
          test "$(jq -r .web_public_config.api_url release-manifest.json)" = "$PRODUCTION_API_URL"
          test "$(jq -r .web_public_config.account_center_url release-manifest.json)" = "$ACCOUNT_CENTER_URL"
      - name: Deploy digest-qualified ECS release
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          DOMAIN_NAME: ${{ vars.PRODUCTION_DOMAIN }}
          CERTIFICATE_ARN: ${{ vars.PRODUCTION_CERTIFICATE_ARN }}
          RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SCHEDULER_STATE: ${{ inputs.scheduler_state }}
          STRIPE_MONTHLY_PRICE_ID: ${{ vars.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_YEARLY_PRICE_ID: ${{ vars.STRIPE_YEARLY_PRICE_ID }}
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          template_bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          web_image=$(jq -r .images.web release-manifest.json)
          api_image=$(jq -r .images.api release-manifest.json)
          jobs_image=$(jq -r .images.jobs release-manifest.json)
          aws cloudformation deploy \
            --stack-name sanchezcloud-scholens-production \
            --template-file deploy/ecs/scholens-production.yml \
            --s3-bucket "$template_bucket" \
            --s3-prefix "cloudformation/${RELEASE_SHA}" \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DomainName="$DOMAIN_NAME" \
              CertificateArn="$CERTIFICATE_ARN" \
              RdsSecurityGroupId="$RDS_SECURITY_GROUP_ID" \
              WebImage="$web_image" \
              ApiImage="$api_image" \
              JobsImage="$jobs_image" \
              ReleaseSha="$RELEASE_SHA" \
              ApplicationEnabled="$APPLICATION_ENABLED" \
              SchedulerState="$SCHEDULER_STATE" \
              StripeMonthlyPriceId="$STRIPE_MONTHLY_PRICE_ID" \
              StripeYearlyPriceId="$STRIPE_YEARLY_PRICE_ID" \
              PostHogApiKey="$POSTHOG_API_KEY"
      - name: Wait for services to stabilize
        run: |
          # JMESPath uses literal backticks.
          # shellcheck disable=SC2016
          mapfile -t services < <(aws cloudformation describe-stack-resources \
            --stack-name sanchezcloud-scholens-production \
            --query 'StackResources[?ResourceType==`AWS::ECS::Service`].PhysicalResourceId' \
            --output text | tr '\t' '\n')
          (( ${#services[@]} > 0 ))
          aws ecs wait services-stable \
            --cluster sanchezcloud-production \
            --services "${services[@]}"
      - name: Verify public deployment
        if: inputs.application_enabled == 'true'
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          [[ "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          retry() {
            local url=$1
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --output /dev/null "$url"; then
                return 0
              fi
              (( attempt == 18 )) || sleep 10
            done
            echo "External smoke check failed: $url" >&2
            return 1
          }
          retry "https://${PRODUCTION_DOMAIN}/healthz"
          retry "https://${PRODUCTION_DOMAIN}/api/v1/healthz"
      - name: Record release operation
        run: |
          {
            echo "### Scholens ${{ inputs.operation }}"
            echo "- Release: \`${{ inputs.release_sha }}\`"
            echo "- Application: \`${{ inputs.application_enabled }}\`"
            echo "- Scheduler: \`${{ inputs.scheduler_state }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
