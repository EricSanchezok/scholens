name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a release or roll back to a previous immutable release
        required: true
        type: choice
        options: [deploy, rollback]
      release_sha:
        description: Exact 40-character SHA whose release manifest will be deployed
        required: true
        type: string
      application_enabled:
        description: Start application services (false for first database migration)
        required: true
        default: "true"
        type: choice
        options: ["false", "true"]
      scheduler_state:
        description: Run the daily Zotero schedule
        required: true
        default: DISABLED
        type: choice
        options: [DISABLED, ENABLED]
      edge_secret_version_id:
        description: Exact current Secrets Manager version ID for the Cloudflare origin token
        required: true
        type: string
      edge_secret_previous_version_id:
        description: Previous accepted token version during rotation; otherwise repeat the current version ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholens-production-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release selection
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SCHEDULER_STATE: ${{ inputs.scheduler_state }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$APPLICATION_ENABLED" != true && "$SCHEDULER_STATE" == ENABLED ]]; then
            echo "The scheduler cannot run while application services are disabled" >&2
            exit 1
          fi
      - name: Check out trusted release control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require control plane to be from main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check out exact release source as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          path: release-source
          persist-credentials: false
          fetch-depth: 0
      - name: Require release revision to be merged into main
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: git -C release-source merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Download and verify release manifest
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          ACCOUNT_CENTER_URL: ${{ vars.ACCOUNT_CENTER_URL }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          aws s3 cp "s3://${bucket}/releases/${RELEASE_SHA}/manifest.json" release-manifest.json
          python scripts/release_manifest.py verify \
            --manifest release-manifest.json \
            --expected-release-sha "$RELEASE_SHA" \
            --expected-account-id "$account_id" \
            --expected-region "$AWS_REGION" \
            --source-root release-source
          test "$(jq -r .web_public_config.api_url release-manifest.json)" = "$PRODUCTION_API_URL"
          test "$(jq -r .web_public_config.account_center_url release-manifest.json)" = "$ACCOUNT_CENTER_URL"
          scan_args=()
          for component in web api jobs; do
            image=$(jq -er --arg component "$component" '.images[$component]' release-manifest.json)
            repository=${image#*/}
            repository=${repository%@*}
            digest=${image##*@}
            scan_args+=(--image "${component}=${repository}@${digest}")
          done
          python scripts/ecr_scan_contract.py \
            "${scan_args[@]}" --output live-image-scans.json
          python scripts/release_manifest.py verify-image-scans \
            --manifest release-manifest.json \
            --image-scan-attestation live-image-scans.json
      - name: Capture previous immutable deployment
        id: previous
        run: |
          if stack=$(aws cloudformation describe-stacks \
            --stack-name sanchezcloud-scholens-production \
            --query 'Stacks[0].{Parameters:Parameters,StackStatus:StackStatus}' \
            --output json 2>describe-stack-error.txt); then
            stack_status=$(jq -er .StackStatus <<<"$stack")
            case "$stack_status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE|IMPORT_ROLLBACK_COMPLETE)
                ;;
              CREATE_IN_PROGRESS|CREATE_FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_FAILED|ROLLBACK_COMPLETE|REVIEW_IN_PROGRESS)
                printf '%s\n' \
                  "Runtime stack creation is incomplete ($stack_status)." \
                  'An administrator must inspect CloudFormation stack events, delete this never-enabled failed runtime stack (termination protection was not enabled), and retry the disabled bootstrap. The GitHub role cannot delete stacks.' >&2
                exit 1
                ;;
              *)
                printf 'Runtime stack is not in a stable deployable state: %s. Inspect CloudFormation events and retry only after administrator review.\n' \
                  "$stack_status" >&2
                exit 1
                ;;
            esac
            parameters=$(jq -cer .Parameters <<<"$stack")
            parameter() {
              jq -er --arg key "$1" \
                '.[] | select(.ParameterKey == $key) | .ParameterValue' \
                <<<"$parameters"
            }
            {
              echo "exists=true"
              echo "release_sha=$(parameter ReleaseSha)"
              echo "application_enabled=$(parameter ApplicationEnabled)"
              echo "scheduler_state=$(parameter SchedulerState)"
            } >> "$GITHUB_OUTPUT"
          elif grep -q 'does not exist' describe-stack-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat describe-stack-error.txt >&2
            exit 1
          fi
      - name: Require fail-closed first runtime bootstrap
        if: steps.previous.outputs.exists == 'false'
        env:
          OPERATION: ${{ inputs.operation }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SCHEDULER_STATE: ${{ inputs.scheduler_state }}
        run: |
          test "$OPERATION" = deploy
          test "$APPLICATION_ENABLED" = false
          test "$SCHEDULER_STATE" = DISABLED
      - name: Require matching protected migration attestation
        if: steps.previous.outputs.exists == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          key="migrations/${RELEASE_SHA}/attestation.json"
          aws s3api get-object \
            --bucket "$bucket" --key "$key" migration-attestation.json >/dev/null
          aws s3api get-object \
            --bucket "$bucket" --key migrations/current.json \
            migration-current.json >/dev/null
          python scripts/release_manifest.py verify-database-contract \
            --manifest release-manifest.json \
            --attestation migration-attestation.json \
            --current migration-current.json \
            --source-root release-source
      - name: Deploy digest-qualified ECS release
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          DOMAIN_NAME: ${{ vars.PRODUCTION_DOMAIN }}
          CERTIFICATE_ARN: ${{ vars.PRODUCTION_CERTIFICATE_ARN }}
          RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_RUNTIME_CLOUDFORMATION_ROLE_ARN }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled }}
          SCHEDULER_STATE: ${{ inputs.scheduler_state }}
          EDGE_SECRET_VERSION_ID: ${{ inputs.edge_secret_version_id }}
          EDGE_SECRET_PREVIOUS_VERSION_ID: ${{ inputs.edge_secret_previous_version_id }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          template_bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          web_image=$(jq -r .images.web release-manifest.json)
          api_image=$(jq -r .images.api release-manifest.json)
          jobs_image=$(jq -r .images.jobs release-manifest.json)
          template=release-source/deploy/ecs/scholens-production.yml
          mapfile -t supported_parameters < <(python scripts/release_manifest.py \
            template-parameters --template "$template")
          parameter_overrides=()
          for parameter in "${supported_parameters[@]}"; do
            case "$parameter" in
              DomainName) parameter_overrides+=("DomainName=$DOMAIN_NAME") ;;
              CertificateArn) parameter_overrides+=("CertificateArn=$CERTIFICATE_ARN") ;;
              RdsSecurityGroupId) parameter_overrides+=("RdsSecurityGroupId=$RDS_SECURITY_GROUP_ID") ;;
              WebImage) parameter_overrides+=("WebImage=$web_image") ;;
              ApiImage) parameter_overrides+=("ApiImage=$api_image") ;;
              JobsImage) parameter_overrides+=("JobsImage=$jobs_image") ;;
              ReleaseSha) parameter_overrides+=("ReleaseSha=$RELEASE_SHA") ;;
              EdgeSecretVersionId) parameter_overrides+=("EdgeSecretVersionId=$EDGE_SECRET_VERSION_ID") ;;
              EdgeSecretPreviousVersionId) parameter_overrides+=("EdgeSecretPreviousVersionId=$EDGE_SECRET_PREVIOUS_VERSION_ID") ;;
              ApplicationEnabled) parameter_overrides+=("ApplicationEnabled=$APPLICATION_ENABLED") ;;
              SchedulerState) parameter_overrides+=("SchedulerState=$SCHEDULER_STATE") ;;
            esac
          done
          aws cloudformation deploy \
            --stack-name sanchezcloud-scholens-production \
            --template-file "$template" \
            --s3-bucket "$template_bucket" \
            --s3-prefix "cloudformation/${RELEASE_SHA}" \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parameter_overrides[@]}"
          aws cloudformation update-termination-protection \
            --stack-name sanchezcloud-scholens-production \
            --enable-termination-protection
      - name: Wait for services to stabilize
        id: stabilize
        continue-on-error: true
        run: |
          # JMESPath uses literal backticks.
          # shellcheck disable=SC2016
          mapfile -t services < <(aws cloudformation describe-stack-resources \
            --stack-name sanchezcloud-scholens-production \
            --query 'StackResources[?ResourceType==`AWS::ECS::Service`].PhysicalResourceId' \
            --output text | tr '\t' '\n')
          (( ${#services[@]} > 0 ))
          aws ecs wait services-stable \
            --cluster sanchezcloud-production \
            --services "${services[@]}"
      - name: Verify public deployment
        id: smoke
        continue-on-error: true
        if: steps.stabilize.outcome == 'success' && inputs.application_enabled == 'true'
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          [[ "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          retry() {
            local url=$1
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --output /dev/null "$url"; then
                return 0
              fi
              (( attempt == 18 )) || sleep 10
            done
            echo "External smoke check failed: $url" >&2
            return 1
          }
          retry "https://${PRODUCTION_DOMAIN}/healthz"
          retry "https://${PRODUCTION_DOMAIN}/api/v1/healthz"
      - name: Restore safe release after candidate verification failure
        if: steps.stabilize.outcome == 'failure' || steps.smoke.outcome == 'failure'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PREVIOUS_EXISTS: ${{ steps.previous.outputs.exists }}
          PREVIOUS_RELEASE_SHA: ${{ steps.previous.outputs.release_sha }}
          PREVIOUS_APPLICATION_ENABLED: ${{ steps.previous.outputs.application_enabled }}
          PREVIOUS_SCHEDULER_STATE: ${{ steps.previous.outputs.scheduler_state }}
          DOMAIN_NAME: ${{ vars.PRODUCTION_DOMAIN }}
          CERTIFICATE_ARN: ${{ vars.PRODUCTION_CERTIFICATE_ARN }}
          RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_RUNTIME_CLOUDFORMATION_ROLE_ARN }}
          EDGE_SECRET_VERSION_ID: ${{ inputs.edge_secret_version_id }}
          EDGE_SECRET_PREVIOUS_VERSION_ID: ${{ inputs.edge_secret_previous_version_id }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          aws cloudformation describe-stack-events \
            --stack-name sanchezcloud-scholens-production \
            --max-items 20 \
            --query 'StackEvents[].{Time:Timestamp,Status:ResourceStatus,LogicalId:LogicalResourceId,Reason:ResourceStatusReason}' || true
          recovered_previous=false
          if [[ "$PREVIOUS_EXISTS" == true && "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            recovery_sha=$PREVIOUS_RELEASE_SHA
            if aws s3api get-object \
              --bucket "$bucket" \
              --key "releases/${recovery_sha}/manifest.json" \
              recovery-manifest.json >/dev/null && \
              aws s3api get-object \
              --bucket "$bucket" \
              --key "migrations/${recovery_sha}/attestation.json" \
              recovery-attestation.json >/dev/null && \
              git worktree add --detach rollback-source "$recovery_sha" && \
              python scripts/release_manifest.py verify \
              --manifest recovery-manifest.json \
              --expected-release-sha "$recovery_sha" \
              --expected-account-id "$account_id" \
              --expected-region "$AWS_REGION" \
              --source-root rollback-source && \
              python scripts/release_manifest.py verify-database-contract \
              --manifest recovery-manifest.json \
              --attestation recovery-attestation.json \
              --current migration-current.json \
              --source-root rollback-source; then
              recovery_enabled=$PREVIOUS_APPLICATION_ENABLED
              recovery_scheduler=$PREVIOUS_SCHEDULER_STATE
              recovery_template=rollback-source/deploy/ecs/scholens-production.yml
              recovered_previous=true
            else
              echo "Previous release failed current verification; disabling the candidate instead." >&2
            fi
          elif [[ "$PREVIOUS_EXISTS" == true ]]; then
            echo "Previous release SHA is invalid; disabling the candidate instead." >&2
          fi
          if [[ "$recovered_previous" != true ]]; then
            recovery_sha=$RELEASE_SHA
            recovery_enabled=false
            recovery_scheduler=DISABLED
            cp release-manifest.json recovery-manifest.json
            recovery_template=release-source/deploy/ecs/scholens-production.yml
          fi
          web_image=$(jq -r .images.web recovery-manifest.json)
          api_image=$(jq -r .images.api recovery-manifest.json)
          jobs_image=$(jq -r .images.jobs recovery-manifest.json)
          mapfile -t supported_parameters < <(python scripts/release_manifest.py \
            template-parameters --template "$recovery_template")
          parameter_overrides=()
          for parameter in "${supported_parameters[@]}"; do
            case "$parameter" in
              DomainName) parameter_overrides+=("DomainName=$DOMAIN_NAME") ;;
              CertificateArn) parameter_overrides+=("CertificateArn=$CERTIFICATE_ARN") ;;
              RdsSecurityGroupId) parameter_overrides+=("RdsSecurityGroupId=$RDS_SECURITY_GROUP_ID") ;;
              WebImage) parameter_overrides+=("WebImage=$web_image") ;;
              ApiImage) parameter_overrides+=("ApiImage=$api_image") ;;
              JobsImage) parameter_overrides+=("JobsImage=$jobs_image") ;;
              ReleaseSha) parameter_overrides+=("ReleaseSha=$recovery_sha") ;;
              EdgeSecretVersionId) parameter_overrides+=("EdgeSecretVersionId=$EDGE_SECRET_VERSION_ID") ;;
              EdgeSecretPreviousVersionId) parameter_overrides+=("EdgeSecretPreviousVersionId=$EDGE_SECRET_PREVIOUS_VERSION_ID") ;;
              ApplicationEnabled) parameter_overrides+=("ApplicationEnabled=$recovery_enabled") ;;
              SchedulerState) parameter_overrides+=("SchedulerState=$recovery_scheduler") ;;
            esac
          done
          aws cloudformation deploy \
            --stack-name sanchezcloud-scholens-production \
            --template-file "$recovery_template" \
            --s3-bucket "$bucket" \
            --s3-prefix "cloudformation/${recovery_sha}/candidate-verification-recovery" \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parameter_overrides[@]}"
          aws cloudformation update-termination-protection \
            --stack-name sanchezcloud-scholens-production \
            --enable-termination-protection
          # JMESPath uses literal backticks.
          # shellcheck disable=SC2016
          mapfile -t services < <(aws cloudformation describe-stack-resources \
            --stack-name sanchezcloud-scholens-production \
            --query 'StackResources[?ResourceType==`AWS::ECS::Service`].PhysicalResourceId' \
            --output text | tr '\t' '\n')
          (( ${#services[@]} > 0 ))
          aws ecs wait services-stable \
            --cluster sanchezcloud-production \
            --services "${services[@]}"
          {
            echo "### Automatic candidate verification recovery"
            echo "- Failed candidate: \`${RELEASE_SHA}\`"
            echo "- Restored release: \`${recovery_sha}\`"
            echo "- Application: \`${recovery_enabled}\`"
            echo "- Scheduler: \`${recovery_scheduler}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the rejected release after recovery
        if: steps.stabilize.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: |
          echo "Candidate stabilization or smoke verification failed; recovery completed." >&2
          exit 1
      - name: Record release operation
        run: |
          {
            echo "### Scholens ${{ inputs.operation }}"
            echo "- Release: \`${{ inputs.release_sha }}\`"
            echo "- Application: \`${{ inputs.application_enabled }}\`"
            echo "- Scheduler: \`${{ inputs.scheduler_state }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
