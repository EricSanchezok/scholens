name: Update production foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or apply the persistent foundation stack
        required: true
        type: choice
        options: [plan, apply]
      ref:
        description: Exact main revision containing the reviewed template
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholens-infrastructure-production
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-latest
    environment: infrastructure-production
    steps:
      - name: Check out reviewed infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require revision to be merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Configure AWS infrastructure credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validate foundation template
        run: >-
          aws cloudformation validate-template
          --template-body file://deploy/ecs/scholens-foundation.yml
          >/dev/null
      - name: Require the administrator-created foundation stack
        run: >-
          aws cloudformation describe-stacks
          --stack-name sanchezcloud-scholens-foundation
          >/dev/null
      - name: Preview foundation change set
        if: inputs.operation == 'plan'
        env:
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
        run: |
          # JMESPath uses literal backticks.
          # shellcheck disable=SC2016
          delegation_secret_arn=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-scholight-mcp-delegation-secret-arn`].Value|[0]' \
            --output text)
          # shellcheck disable=SC2016
          delegation_kms_key_arn=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-scholight-configuration-key-arn`].Value|[0]' \
            --output text)
          test "$delegation_secret_arn" != None
          test "$delegation_kms_key_arn" != None
          change_set="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws cloudformation create-change-set \
            --stack-name sanchezcloud-scholens-foundation \
            --change-set-name "$change_set" \
            --change-set-type UPDATE \
            --template-body file://deploy/ecs/scholens-foundation.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=GitHubOidcProviderArn,ParameterValue="$GITHUB_OIDC_PROVIDER_ARN" \
              ParameterKey=ProductionDomain,ParameterValue="$PRODUCTION_DOMAIN" \
              ParameterKey=AlertEmail,ParameterValue="$ALERT_EMAIL" \
              ParameterKey=ScholightMcpDelegationSecretArn,ParameterValue="$delegation_secret_arn" \
              ParameterKey=ScholightMcpDelegationKmsKeyArn,ParameterValue="$delegation_kms_key_arn" \
            --tags \
              Key=System,Value=SanchezCloud \
              Key=Product,Value=Scholens \
              Key=Environment,Value=production \
              Key=ManagedBy,Value=CloudFormation \
            >/dev/null
          aws cloudformation wait change-set-create-complete \
            --stack-name sanchezcloud-scholens-foundation \
            --change-set-name "$change_set" || true
          aws cloudformation describe-change-set \
            --stack-name sanchezcloud-scholens-foundation \
            --change-set-name "$change_set" \
            --query '{Status:Status,Reason:StatusReason,Changes:Changes[].ResourceChange.{Action:Action,LogicalId:LogicalResourceId,Type:ResourceType,Replacement:Replacement}}'
          aws cloudformation delete-change-set \
            --stack-name sanchezcloud-scholens-foundation \
            --change-set-name "$change_set"
      - name: Apply foundation change set
        if: inputs.operation == 'apply'
        env:
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
        run: |
          # JMESPath uses literal backticks.
          # shellcheck disable=SC2016
          delegation_secret_arn=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-scholight-mcp-delegation-secret-arn`].Value|[0]' \
            --output text)
          # shellcheck disable=SC2016
          delegation_kms_key_arn=$(aws cloudformation list-exports \
            --query 'Exports[?Name==`sanchezcloud-scholight-configuration-key-arn`].Value|[0]' \
            --output text)
          test "$delegation_secret_arn" != None
          test "$delegation_kms_key_arn" != None
          aws cloudformation deploy \
            --stack-name sanchezcloud-scholens-foundation \
            --template-file deploy/ecs/scholens-foundation.yml \
            --role-arn "$CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --tags \
              System=SanchezCloud \
              Product=Scholens \
              Environment=production \
              ManagedBy=CloudFormation \
            --parameter-overrides \
              GitHubOidcProviderArn="$GITHUB_OIDC_PROVIDER_ARN" \
              ProductionDomain="$PRODUCTION_DOMAIN" \
              AlertEmail="$ALERT_EMAIL" \
              ScholightMcpDelegationSecretArn="$delegation_secret_arn" \
              ScholightMcpDelegationKmsKeyArn="$delegation_kms_key_arn"
      - name: Record foundation operation
        run: |
          {
            echo "### Scholens foundation ${{ inputs.operation }}"
            echo "- Revision: \`$(git rev-parse HEAD)\`"
            echo "- Stack: \`sanchezcloud-scholens-foundation\`"
          } >> "$GITHUB_STEP_SUMMARY"
