name: Deploy or roll back production Scholens

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a reviewable change set or execute its exact ARN
        required: true
        type: choice
        options: [plan, apply]
      ref:
        description: Exact merged control-plane revision (reuse the plan revision for apply)
        required: true
        default: main
        type: string
      change_set_arn:
        description: Exact ARN from the completed plan operation; required for apply
        required: false
        type: string
      release_sha:
        description: Exact published ARM64 release SHA
        required: true
        type: string
      application_enabled:
        description: Start services only after the migration attestation is recorded
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      background_mode:
        description: Preserve current worker mode or explicitly adopt/roll back admission
        required: true
        default: preserve
        type: choice
        options: [preserve, resident, admitted]

permissions:
  contents: read
  id-token: write
concurrency:
  group: scholens-personal-control-plane
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: personal-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed control plane
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: {version: "0.9.2"}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "669409472143"
      - name: Run guarded personal operation
        env:
          OPERATION: ${{ inputs.operation }}
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          APPLICATION_ENABLED: ${{ inputs.application_enabled || 'false' }}
          BACKGROUND_MODE: ${{ inputs.background_mode || 'preserve' }}
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_RUNTIME_CLOUDFORMATION_ROLE_ARN }}
        run: |
          uv run --no-project --with PyYAML==6.0.3 --with boto3==1.43.61 python scripts/personal_control_plane.py runtime "$OPERATION" \
            --change-set-arn "$CHANGE_SET_ARN" --release-sha "$RELEASE_SHA" --application-enabled "$APPLICATION_ENABLED" --background-mode "$BACKGROUND_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.operation == 'plan'
        with:
          name: personal-change-set-${{ github.run_id }}
          path: personal-change-set.json
          if-no-files-found: ignore
          retention-days: 30
