name: Update personal foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a reviewable change set or execute its exact ARN
        required: true
        type: choice
        options: [plan, apply]
      ref:
        description: Exact merged control-plane revision (reuse the plan revision for apply)
        required: true
        default: main
        type: string
      change_set_arn:
        description: Exact ARN from the completed plan operation; required for apply
        required: false
        type: string

permissions:
  contents: read
  id-token: write
concurrency:
  group: scholens-personal-control-plane
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    environment: personal-infrastructure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed control plane
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: {version: "0.9.2"}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "669409472143"
      - name: Run guarded personal operation
        env:
          OPERATION: ${{ inputs.operation }}
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
          RELEASE_SHA: ""
          APPLICATION_ENABLED: "false"
          CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_FOUNDATION_CLOUDFORMATION_ROLE_ARN }}
        run: |
          uv run --no-project --with PyYAML==6.0.3 python scripts/personal_control_plane.py foundation "$OPERATION" \
            --change-set-arn "$CHANGE_SET_ARN" --release-sha "$RELEASE_SHA" --application-enabled "$APPLICATION_ENABLED"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.operation == 'plan'
        with:
          name: personal-change-set-${{ github.run_id }}
          path: personal-change-set.json
          if-no-files-found: ignore
          retention-days: 30
