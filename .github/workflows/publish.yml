name: Publish immutable release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag already merged into main
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scholens-image-publish-${{ github.event.workflow_run.head_sha || inputs.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.revision.outputs.release_sha }}
      created_at: ${{ steps.revision.outputs.created_at }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve and validate immutable revision
        id: revision
        run: |
          release_sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "created_at=$(git show -s --format=%cI "$release_sha")" >> "$GITHUB_OUTPUT"

  quality:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.release_sha }}
    secrets:
      IDENTITY_READER_PRIVATE_KEY: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}

  publish:
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    environment: image-publish
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - name: Mint read-only SanchezCloud Identity token
        id: identity-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.IDENTITY_READER_APP_ID }}
          private-key: ${{ secrets.IDENTITY_READER_PRIVATE_KEY }}
          owner: EricSanchezok
          repositories: sanchezcloud-identity
          permission-contents: read
      - name: Configure private dependency access
        env:
          IDENTITY_READ_TOKEN: ${{ steps.identity-token.outputs.token }}
        run: >-
          git config --global
          url."https://x-access-token:${IDENTITY_READ_TOKEN}@github.com/".insteadOf
          "https://github.com/"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.2"
          enable-cache: true
      - name: Resolve Identity schema contract
        id: identity
        run: |
          uv sync --project server --frozen --no-dev
          schema_version=$(server/.venv/bin/python -c \
            'import sanchezcloud_identity as identity; print(identity.AUTH_SCHEMA_VERSION)')
          echo "schema_version=$schema_version" >> "$GITHUB_OUTPUT"
      - name: Configure AWS publishing credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Web and export source maps from one build graph
        id: web
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          ACCOUNT_CENTER_URL: ${{ vars.ACCOUNT_CENTER_URL }}
        run: |
          docker buildx bake --file web/docker-bake.hcl \
            --metadata-file web-build-metadata.json
          digest=$(jq -er '."web-runtime"."containerimage.digest"' web-build-metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          find web-source-maps -type f -name '*.map' -print -quit | grep -q .
          test -s web-source-maps/index.json
      - name: Build and push API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sanchezcloud-scholens-api:git-${{ needs.prepare.outputs.release_sha }}
          provenance: mode=max
          sbom: true
          secrets: |
            github_token=${{ steps.identity-token.outputs.token }}
      - name: Build and push jobs
        id: jobs
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: jobs/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sanchezcloud-scholens-jobs:git-${{ needs.prepare.outputs.release_sha }}
          provenance: mode=max
          sbom: true
      - name: Create deterministic release manifest
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          CREATED_AT: ${{ needs.prepare.outputs.created_at }}
          IDENTITY_SCHEMA_VERSION: ${{ steps.identity.outputs.schema_version }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          JOBS_DIGEST: ${{ steps.jobs.outputs.digest }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          ACCOUNT_CENTER_URL: ${{ vars.ACCOUNT_CENTER_URL }}
        run: |
          python scripts/release_manifest.py create \
            --release-sha "$RELEASE_SHA" \
            --created-at "$CREATED_AT" \
            --identity-schema-version "$IDENTITY_SCHEMA_VERSION" \
            --web-api-url "$PRODUCTION_API_URL" \
            --account-center-url "$ACCOUNT_CENTER_URL" \
            --web-image "$REGISTRY/sanchezcloud-scholens-web@$WEB_DIGEST" \
            --api-image "$REGISTRY/sanchezcloud-scholens-api@$API_DIGEST" \
            --jobs-image "$REGISTRY/sanchezcloud-scholens-jobs@$JOBS_DIGEST" \
            --source-maps-index web-source-maps/index.json \
            --output release-manifest.json
          python scripts/release_manifest.py verify \
            --manifest release-manifest.json \
            --expected-release-sha "$RELEASE_SHA" \
            --expected-account-id "${REGISTRY%%.*}" \
            --expected-region "$AWS_REGION"
      - name: Store immutable release assets
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          bucket="sanchezcloud-scholens-releases-${account_id}-${AWS_REGION}"
          existing=$(mktemp)
          trap 'rm -f "$existing"' EXIT
          put_immutable() {
            local source=$1
            local object_key=$2
            local content_type=$3
            if aws s3api head-object \
              --bucket "$bucket" --key "$object_key" >/dev/null 2>&1; then
              aws s3api get-object \
                --bucket "$bucket" --key "$object_key" "$existing" >/dev/null
              cmp --silent "$source" "$existing" || {
                echo "Immutable release object differs: $object_key" >&2
                return 1
              }
              return 0
            fi
            if aws s3api put-object \
              --bucket "$bucket" \
              --key "$object_key" \
              --body "$source" \
              --content-type "$content_type" \
              --cache-control no-store \
              --if-none-match '*' >/dev/null; then
              return 0
            fi
            aws s3api get-object \
              --bucket "$bucket" --key "$object_key" "$existing" >/dev/null
            cmp --silent "$source" "$existing" || {
              echo "Concurrent immutable object differs: $object_key" >&2
              return 1
            }
          }
          while IFS= read -r -d '' source_map; do
            relative=${source_map#web-source-maps/}
            put_immutable \
              "$source_map" "source-maps/${RELEASE_SHA}/${relative}" \
              application/json
          done < <(find web-source-maps -type f -name '*.map' -print0 | sort -z)
          put_immutable \
            web-source-maps/index.json \
            "source-maps/${RELEASE_SHA}/index.json" \
            application/json
          key="releases/${RELEASE_SHA}/manifest.json"
          put_immutable release-manifest.json "$key" application/json
      - name: Upload release manifest to workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scholens-release-${{ needs.prepare.outputs.release_sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
