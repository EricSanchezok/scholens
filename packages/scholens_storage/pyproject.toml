[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholens-storage"
version = "0.1.0"
requires-python = ">=3.12"
description = "Cancellable bounded private object transfers"
readme = "README.md"
dependencies = ["aiobotocore>=3.9.1,<4", "aiohttp>=3.14.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scholens_storage"]
