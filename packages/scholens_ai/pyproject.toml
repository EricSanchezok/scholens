[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholens_ai"]

[project]
name = "scholens-ai"
version = "0.1.0"
requires-python = ">= 3.12"
description = "Provider-neutral AI runtime profiles for Scholens services"
dependencies = [
    "httpx>=0.28.0",
    "pydantic-ai-slim[anthropic,google,openai]>=1.0,<2",
]
