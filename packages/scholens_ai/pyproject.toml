[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholens_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/scholens_ai/py.typed" = "scholens_ai/py.typed"

[project]
name = "scholens-ai"
version = "0.1.0"
requires-python = ">=3.12"
description = "Provider-neutral AI runtime profiles for Scholens services"
readme = "README.md"
dependencies = [
    "huggingface-hub>=0.35,<1",
    "httpx>=0.28.0",
    "numpy>=2.2,<3",
    "onnxruntime>=1.23,<2",
    "pydantic-ai-slim[anthropic,google,openai]>=1.0,<2",
    "tokenizers>=0.22,<1",
]
