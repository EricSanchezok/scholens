[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholens-job-contracts"
version = "0.1.0"
requires-python = ">=3.12"
description = "Shared transport contracts for Scholens background jobs"
readme = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/scholens_job_contracts"]
