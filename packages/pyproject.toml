[project]
name = "scholens-shared-packages"
version = "0.1.0"
requires-python = ">=3.12"
description = "Direct development environment for Scholens shared Python packages"
readme = "README.md"
dependencies = [
    "scholens-ai",
    "scholens-observability",
]

[tool.uv]
package = false

[tool.uv.sources]
scholens-ai = { workspace = true }
scholens-observability = { workspace = true }

[tool.uv.workspace]
members = [
    "scholens_ai",
    "scholens_observability",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "ruff==0.15.22",
]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
strict = true

[tool.pytest.ini_options]
testpaths = [
    "scholens_ai/tests",
    "scholens_observability/tests",
]

[tool.ruff]
target-version = "py312"
